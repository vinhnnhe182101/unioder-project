server:
  port: ${CATALOG_SERVICE_PORT:0}

spring:
  datasource:
    url: jdbc:mysql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:3308}/${CATALOG_DB_NAME:catalog_service}?createDatabaseIfNotExist=true
    username: ${CATALOG_DB_USERNAME:root}
    password: ${CATALOG_DB_PASSWORD:root}
