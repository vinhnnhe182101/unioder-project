eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: ${EUREKA_HEARTBEAT_INTERVAL:5}
    lease-expiration-duration-in-seconds: ${EUREKA_HEARTBEAT_TIMEOUT:10}