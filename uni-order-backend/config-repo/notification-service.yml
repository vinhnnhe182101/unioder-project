server:
  port: ${NOTIFICATION_SERVICE_PORT:0}

spring:
  datasource:
    url: jdbc:mysql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:3310}/${NOTIFICATION_DB_NAME:notification_service}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: ${NOTIFICATION_DB_USERNAME:root}
    password: ${NOTIFICATION_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    baseline-on-migrate: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:6B59703373367639792F423F4528482B4D6251655468576D5A7134743777217A}
      
springdoc:
  api-docs:
    path: /api/notification/v3/api-docs
  swagger-ui:
    enabled: false