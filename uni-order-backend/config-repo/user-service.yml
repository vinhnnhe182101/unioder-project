server:
  port: ${NOTIFICATION_SERVICE_PORT:0}
  
spring:
  datasource:
    url: jdbc:mysql://${USER_DB_HOST:localhost}:${USER_DB_PORT:3307}/${USER_DB_NAME:auth_service}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Báo cho Hibernate không tự tạo bảng (để Flyway lo)
      ddl-auto: none

  flyway:
    # Báo cho Flyway tạo baseline khi CSDL đã có sẵn bảng
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:6B59703373367639792F423F4528482B4D6251655468576D5A7134743777217A}
      expiration-ms: ${JWT_ACCESS_EXPIRATION:86400000}
      refresh-token:
        expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}
